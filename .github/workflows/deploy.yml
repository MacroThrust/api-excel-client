name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout api-excel-client
        uses: actions/checkout@v4
        with:
          path: api-excel-client
          # Avoid persisting credentials from this checkout so the api-client
          # checkout below can use its own token.
          persist-credentials: false

      - name: Checkout api-client
        uses: actions/checkout@v4
        with:
          repository: MacroThrust/api-client
          path: api-client
          # Private repo checkout: uses API_CLIENT_CHECKOUT_TOKEN when set, otherwise
          # the workflow GITHUB_TOKEN (requires org/repo access policy — see README).
          token: ${{ secrets.API_CLIENT_CHECKOUT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-excel-client/package-lock.json

      - name: Build shared api-client
        working-directory: api-client
        run: |
          npm install
          npm run build

      - name: Install add-in dependencies
        working-directory: api-excel-client
        run: npm ci

      - name: Test user guide build
        working-directory: api-excel-client
        run: npm run test:docs

      - name: Build for GitHub Pages
        working-directory: api-excel-client
        env:
          NODE_ENV: production
          # GitHub Pages URL: https://<owner>.github.io/<repo>/
          # github.repository is "owner/repo", so we extract the repo name.
          ADDIN_HOST: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-excel-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
